<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="description" content="Mapa público das posições mais recentes dos ônibus de São Paulo." />
    <title>Ônibus ao vivo · Time Marrom</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/mapa.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="#inicio" aria-label="Time Marrom, início">
          <span class="brand-mark" aria-hidden="true">tm</span>
          <span>TIME <b>MARROM</b></span>
        </a>
        <nav class="topbar-nav" aria-label="Navegação principal"><a href="qualidade.html">Qualidade</a><a href="brutos.html">Dados brutos <span aria-hidden="true">↗</span></a></nav>
      </header>

      <section class="intro" id="inicio">
        <div>
          <p class="eyebrow">MOBILIDADE EM TEMPO REAL</p>
          <h1>Ônibus <span>ao vivo</span></h1>
          <p class="intro-copy">Acompanhe no mapa as posições mais recentes da frota.</p>
        </div>
      </section>

      <section class="toolbar" aria-label="Filtros do mapa">
        <label class="line-filter" for="line-select">
          <span class="filter-icon" aria-hidden="true">⌕</span>
          <span class="select-wrap">
            <span class="select-label">LINHA</span>
            <select id="line-select" disabled>
              <option value="">Todas as linhas</option>
            </select>
          </span>
        </label>
        <div class="vehicle-count" aria-live="polite">
          <span class="count-icon" aria-hidden="true">●</span>
          <strong id="vehicle-count">—</strong>
          <span>veículos no mapa</span>
        </div>
      </section>

      <section class="map-frame" aria-label="Mapa de posições dos ônibus">
        <div id="map" role="application" aria-label="Mapa interativo com marcadores de ônibus"></div>
        <div class="map-message" id="map-message" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span id="message-title">Carregando posições…</span>
          <small id="message-detail">Consultando dados públicos da frota.</small>
          <button id="retry-button" type="button" hidden>Tentar novamente</button>
        </div>
        <button class="locate-button" id="fit-button" type="button" aria-label="Voltar para a visão do município" title="Voltar para a visão do município">⤢</button>
      </section>
      <footer class="page-footer">
        <span>Fonte: SPTrans Olho Vivo</span>
        <span>Posições podem apresentar atraso.</span>
      </footer>
    </main>
  </body>
</html>
